version: "3.9"

services:
  storefront-backend:
    image: storefront-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storefront-backend
    ports:
      - "8080:8080"
    environment:
      # JVM tuning
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UnlockExperimentalVMOptions -Djava.security.egd=file:/dev/./urandom"
      # Spring Boot profile
      SPRING_PROFILES_ACTIVE: docker
      # Application settings
      SERVER_PORT: "8080"
      TZ: UTC
      # External service connections (override as needed)
      # DATABASE_URL: jdbc:postgresql://db-host:5432/storefront
      # REDIS_HOST: redis-host
      # KAFKA_BOOTSTRAP_SERVERS: kafka-host:9092
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
