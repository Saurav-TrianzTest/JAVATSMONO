spring.application.name=storefront-backend
server.port=8080

# Spring Boot Actuator Health Check Configuration for Container Orchestration
# Enables /actuator/health endpoint for Kubernetes/ECS health probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Health check endpoint available at /actuator/health
# This provides standardized health checks for containerized deployments
